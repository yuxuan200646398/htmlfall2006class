<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A typographic setting of Jane Taylor's 1806 lullaby.">
  <meta name="robots" content="noindex, nofollow">
  <title>Twinkle, Twinkle, Little Star</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/zuizhongban.css">
</head>
<body>
  <header>
    <h1>Twinkle, Twinkle, Little Star</h1>
    <p class="artist">Traditional English lullaby</p>
  </header>
  <main>
    <p class="loud">Twinkle, twinkle, little star,</p>
    <p class="soft">How I wonder what you are!</p>
    <p class="high">Up above the world so high,</p>
    <p class="loud">Like a diamond in the sky.</p>
  </main>

  <footer>
    <p class="copyright">Lyrics by Jane Taylor, 1806. Public domain.</p>
  </footer>

</body>
</html>
